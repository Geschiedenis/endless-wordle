<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
  <title>Your Endless Wordle verification code</title>
  <style>:root { color-scheme: dark; supported-color-schemes: dark; }</style>
</head>
<body style="margin:0;padding:0;background-color:#121213;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#121213;">Enter this code to confirm it's you.</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#121213" style="background-color:#121213;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#1f1f22" style="width:100%;max-width:480px;background-color:#1f1f22;border:1px solid #3f3f46;border-radius:10px;">
          <tr>
            <td align="center" style="padding:32px 32px 0;">
              <a href="{{ .SiteURL }}" style="text-decoration:none;">
                <img src="{{ .SiteURL }}/logo.png" width="64" height="64" alt="Endless Wordle" style="display:block;width:64px;height:64px;border:0;color:#f4f4f5;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;">
              </a>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:24px 32px 0;color:#f4f4f5;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:24px;font-weight:700;letter-spacing:-0.3px;line-height:30px;">Confirm it's you</td>
          </tr>
          <tr>
            <td align="center" style="padding:12px 32px 0;color:#f4f4f5;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:24px;">Enter this code to continue.</td>
          </tr>
          <tr>
            <td align="center" style="padding:24px 32px 0;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#27272a" style="padding:14px 24px;background-color:#27272a;border-radius:8px;color:#f4f4f5;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:28px;font-weight:700;letter-spacing:6px;line-height:34px;">{{ .Token }}</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px 32px;color:#a1a1aa;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;">If you didn't ask for this code, you can ignore this email.</td>
          </tr>
        </table>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:480px;">
          <tr>
            <td align="center" style="padding:16px 32px 0;color:#a1a1aa;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;">
              <a href="{{ .SiteURL }}" style="color:#a1a1aa;text-decoration:underline;">Endless Wordle</a>, the Wordle that never stops.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
